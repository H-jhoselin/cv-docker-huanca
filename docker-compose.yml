services:
  database:
    image: mysql:8.0
    container_name: cv_database
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: cv_db
      MYSQL_USER: cv_user
      MYSQL_PASSWORD: cv_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cv_network

  backend:
    image: ${DOCKERHUB_USER}/huanca-backend:v1
    container_name: cv_backend
    restart: always
    environment:
      PORT: 4000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: cv_user
      DB_PASSWORD: cv_password
      DB_NAME: cv_db
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cv_network

  frontend:
    image: ${DOCKERHUB_USER}/huanca-frontend:v1
    container_name: cv_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cv_network

volumes:
  mysql_data:

networks:
  cv_network:
    driver: bridge
